name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.99.1
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      - name: Test
        run: cargo +1.99.1 test --locked
      - name: Clippy
        run: cargo +1.99.1 clippy --locked --all-targets -- -D warnings
      - name: Release build
        run: cargo +1.99.1 build --release --locked
      - name: Check executable
        if: runner.os == 'Windows'
        run: .\target\release\aiterm.exe --help
      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: aiterm-windows-x86_64
          path: |
            target/release/aiterm.exe
            config.example.toml
            README.md
          if-no-files-found: error
          retention-days: 14
