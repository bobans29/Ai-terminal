name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: Native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust 1.99.1
        shell: bash
        run: rustup toolchain install 1.99.1 --profile minimal --component clippy
      - name: Test
        run: cargo +1.99.1 test --locked
      - name: Clippy
        run: cargo +1.99.1 clippy --locked --all-targets -- -D warnings
      - name: Release build
        run: cargo +1.99.1 build --release --locked
      - name: Check executable
        if: runner.os == 'Windows'
        run: .\target\release\aiterm.exe --help
      - name: Verify Windows release has no extra console
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $image = [IO.File]::ReadAllBytes((Resolve-Path 'target/release/aiterm.exe'))
          $peOffset = [BitConverter]::ToInt32($image, 0x3c)
          $subsystem = [BitConverter]::ToUInt16($image, $peOffset + 24 + 68)
          if ($subsystem -ne 2) { throw 'Release must use the Windows GUI subsystem (2).' }
      - name: Verify release CLI output in a parent console
        if: runner.os == 'Windows'
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows/test-console-output.ps1
      - name: Test release source selection
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File scripts/windows/test-release-source.ps1
      - name: Test installer on Windows PowerShell 5.1
        if: runner.os == 'Windows'
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/windows/test-install.ps1
      - name: Test installer on PowerShell 7
        if: runner.os == 'Windows'
        run: pwsh -NoProfile -File scripts/windows/test-install.ps1
      - name: Upload Windows executable
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: aiterm-windows-x86_64
          path: |
            target/release/aiterm.exe
            config.example.toml
            README.md
          if-no-files-found: error
          retention-days: 14
