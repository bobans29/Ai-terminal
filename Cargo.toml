[package]
name = "aiterm"
version = "0.1.0"
edition = "2021"
description = "Cross-platform GPU terminal (Milestone 1: one shell window)"
readme = "README.md"
publish = false

# Direct deps are pinned so a later major of wgpu, winit, or alacritty_terminal
# does not silently change the renderer or the event loop. Transitive crates
# still float; they need a recent stable toolchain (edition 2024).
[dependencies]
alacritty_terminal = "=0.24.2"
arboard = "=3.4.1"
bytemuck = { version = "=1.21.0", features = ["derive"] }
fontdue = "=0.9.3"
pollster = "=0.3.0"
portable-pty = "=0.8.1"
serde = { version = "1", features = ["derive"] }
toml = "0.8.23"
wgpu = "=23.0.1"
winit = "=0.30.8"

[profile.release]
lto = false
codegen-units = 16
